name = "strategyos-telegram-cron"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "36253f0f7468dbbf4d8fb2b01c596709"

[[kv_namespaces]]
binding = "STRATEGYOS_DB"
id = "aa2cc8f542ac4fce8d756a4575ac6fc5"

[vars]
TELEGRAM_CHAT_DONO = "1969798643"
TELEGRAM_CHAT_EQUIPE = "-5232346648"

# Horários em UTC (Bahia = UTC-3)
# 11:00 UTC = 08:00 -> resumo do ciclo mensal (só executa no dia 6)
# 21:00 UTC = 18:00 -> fechamento de caixa diário
# 23:00 UTC = 20:00 -> nova tentativa automática se o envio das 18h falhar
[triggers]
crons = ["0 11 * * *", "0 21 * * *", "0 23 * * *"]
